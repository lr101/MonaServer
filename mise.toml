[tools]
go = "1.27.1"
flutter = "3.47.3"
node = "24.21.0"
oapi-codegen = "2.8.0"
sqlc = "1.31.1"

[tasks.test]
description = "Run the Go server test suite"
dir = "go-server"
run = "go test ./..."

[tasks.run]
description = "Run Go directly with the configured local database and object store"
dir = "go-server"
run = "go run ./cmd/server"

[tasks.build]
description = "Build the Go server"
dir = "go-server"
run = "go build -o bin/server ./cmd/server"

[tasks.flutter-analyze]
description = "Analyze the Flutter app"
depends = ["flutter-setup"]
dir = "flutter"
run = "flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings"

[tasks.flutter-setup]
description = "Install Flutter dependencies when manifests or SDK pins change"
dir = "flutter"
sources = ["pubspec.yaml", "pubspec.lock", "api/pubspec.yaml", "api/pubspec.lock", "../mise.toml"]
outputs = [".dart_tool/package_config.json", "api/.dart_tool/package_config.json"]
# Pub preserves unchanged config mtimes; mark successful setup for mise's check.
run = "flutter pub get && (cd api && flutter pub get) && touch .dart_tool/package_config.json api/.dart_tool/package_config.json"

[tasks.flutter-test]
description = "Run Flutter app tests"
depends = ["flutter-setup"]
dir = "flutter"
run = "flutter test --no-pub"

[tasks.flutter-api-test]
description = "Test the generated Dart API client"
depends = ["flutter-setup"]
dir = "flutter/api"
run = "flutter test --no-pub"

[tasks.flutter-build-web]
description = "Build the Flutter web app with Wasm and a JavaScript fallback"
depends = ["flutter-setup"]
dir = "flutter"
run = """
set -eu
if [ -n "${E2E_API_URL:-}" ]; then
  flutter build web --wasm --release --no-pub --dart-define=API_HOST="$E2E_API_URL"
else
  flutter build web --wasm --release --no-pub
fi
"""

[tasks.flutter-playwright-setup]
description = "Install Playwright dependencies and Chromium for Flutter web checks"
dir = "flutter/e2e"
run = "npm ci && npm run install:browsers"

[tasks.flutter-web-e2e]
description = "Run Playwright against the built Flutter web app"
dir = "flutter/e2e"
run = "npm ci && npm test"

[tasks.testdata-test]
description = "Validate the reusable local test scenarios"
run = "node --test testdata/seed.test.mjs"

[tasks.testdata-seed]
description = "Seed the disposable API with reusable users, groups, pins, and likes"
run = "node testdata/seed.mjs"

[tasks.flutter-verify-web]
description = "Build Flutter web and verify the login/group flow with Playwright"
depends = ["flutter-setup"]
dir = "flutter"
run = "E2E_WEB_API_HOST=\"${E2E_API_URL:-http://127.0.0.1:8080}\" && flutter build web --wasm --release --no-pub --dart-define=API_HOST=\"$E2E_WEB_API_HOST\" && cd e2e && npm ci && npm run install:browsers && npm test"

[tasks.flutter-build-apk]
description = "Build a debug Android APK"
depends = ["flutter-setup"]
dir = "flutter"
run = "flutter build apk --debug --no-pub"

[tasks.flutter-run]
description = "Run the Flutter app (pass Flutter options after --)"
depends = ["flutter-setup"]
dir = "flutter"
run = "flutter run --no-pub"
