[tools]
go = "1.27.1"
flutter = "3.47.2"
oapi-codegen = "2.8.0"
sqlc = "1.31.1"

[tasks.test]
description = "Run the Go server test suite"
dir = "go-server"
run = "go test ./..."

[tasks.build]
description = "Build the Go server"
dir = "go-server"
run = "go build -o bin/server ./cmd/server"

[tasks.flutter-analyze]
description = "Analyze the Flutter app"
dir = "flutter"
run = "flutter pub get && flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings"

[tasks.flutter-test]
description = "Run Flutter app tests"
dir = "flutter"
run = "flutter pub get && flutter test --no-pub"

[tasks.flutter-api-test]
description = "Test the generated Dart API client"
dir = "flutter/api"
run = "flutter pub get && flutter test"

[tasks.flutter-build-web]
description = "Build the Flutter web app with Wasm and a JavaScript fallback"
dir = "flutter"
run = "flutter pub get && flutter build web --wasm --release --no-pub"
