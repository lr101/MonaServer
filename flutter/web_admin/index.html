<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Stick-It administrative workspace.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#005cbb">
  <meta name="application-name" content="Stick-It Admin">
  <meta name="admin-entry" content="true">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://stick-it.lr-projects.de http://localhost:8080 http://127.0.0.1:8080; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';">

  <link rel="icon" type="image/svg+xml" href="admin-logo.svg">
  <link rel="manifest" href="admin-manifest.json">

  <title>Stick-It Admin</title>

  <style>
    html {
      height: 100%;
    }

    body {
      background-color: #f5f7fb;
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
    }

    #splash-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    .splash-logo {
      width: 96px;
      height: auto;
    }

    .splash-loader {
      border: 4px solid #dbe5f3;
      border-top: 4px solid #005cbb;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      margin-top: 24px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body data-admin-entry="true">
  <div id="splash-screen">
    <img class="splash-logo" src="admin-logo.svg" alt="Stick-It Admin">
    <div class="splash-loader" aria-label="Loading Stick-It Admin"></div>
  </div>

  <script src="admin_splash.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
