events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The standard map covers the normal web assets. Add the .mjs type used by
    # Flutter's Wasm support runtime, which is not present in every image.
    types {
        application/javascript mjs;
        application/json map;
    }

    server {
        listen       80;
        server_name  localhost;
        root         /usr/share/nginx/html;
        index        index.html index.htm;
        client_max_body_size 25m;

        # Flutter Web is served from this origin. Proxying API traffic here
        # keeps browser requests same-origin, so Authorization headers do not
        # trigger a cross-origin preflight. API_UPSTREAM is substituted by the
        # image entrypoint and is deployment configuration, never request data.
        location ^~ /api/ {
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_ssl_name $proxy_host;
            proxy_pass __API_UPSTREAM__;
        }

        # Keep the server-rendered terms/privacy pages reachable from the
        # Flutter Web origin as well. API calls remain under /api/ above.
        location ^~ /public/ {
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_ssl_name $proxy_host;
            proxy_pass __API_UPSTREAM__;
        }

        # Flutter assets must return their actual file or a 404. Falling back
        # to index.html here makes a missing config file look like a success.
        location ^~ /assets/ {
            try_files $uri =404;
        }

        # The generated bootstrap dynamically imports the .mjs support runtime
        # and fetches the Wasm file. Do not send either through the SPA fallback.
        location ~* \.(?:css|js|mjs|wasm|json|bin|png|jpe?g|gif|ico|ttf|map|symbols)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
