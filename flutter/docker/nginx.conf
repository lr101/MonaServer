events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The standard map covers the normal web assets. Add the .mjs type used by
    # Flutter's Wasm support runtime, which is not present in every image.
    types {
        application/javascript mjs;
        application/json map;
    }

    server {
        listen       80;
        server_name  localhost;
        root         /usr/share/nginx/html;
        index        index.html index.htm;

        # Flutter assets must return their actual file or a 404. Falling back
        # to index.html here makes a missing config file look like a success.
        location ^~ /assets/ {
            try_files $uri =404;
        }

        # The generated bootstrap dynamically imports the .mjs support runtime
        # and fetches the Wasm file. Do not send either through the SPA fallback.
        location ~* \.(?:css|js|mjs|wasm|json|bin|png|jpe?g|gif|ico|ttf|map|symbols)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
