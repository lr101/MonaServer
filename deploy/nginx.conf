pid /tmp/nginx.pid;
worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types { application/javascript mjs; }
    client_body_temp_path /tmp/nginx/client;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    client_max_body_size 25m;
    server_tokens off;

    upstream api { server 127.0.0.1:8080; }
    upstream objects { server rustfs:9000; }
    # Only the private Traefik listener accepts Traefik's sanitized client chain.
    map $server_port $admin_forwarded_for {
        8083 $http_x_forwarded_for;
        default "";
    }

    server {
        listen 8081;
        server_name _;
        root /srv/web;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        location = /healthz { access_log off; proxy_pass http://api/public/api-docs; }
        # Deny both current admin generations on the public web listener.
        location = /api/v2/admin { add_header X-Admin-Blocked true always; return 404; }
        location ^~ /api/v2/admin/ { add_header X-Admin-Blocked true always; return 404; }
        location = /api/v3/admin { add_header X-Admin-Blocked true always; return 404; }
        location ^~ /api/v3/admin/ { add_header X-Admin-Blocked true always; return 404; }
        location ^~ /api/ {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            # Traefik sanitizes client-supplied forwarding headers. Preserve its
            # client chain without adding Traefik's container IP as the last hop.
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass http://api;
        }
        location ^~ /public/ { proxy_set_header Host $host; proxy_pass http://api; }
        location ^~ /swagger-ui { proxy_set_header Host $host; proxy_pass http://api; }
        # Presigned GET URLs use the public Host and the bucket path as signed.
        location ^~ /monaserver/ {
            limit_except GET HEAD { deny all; }
            proxy_set_header Host $host;
            proxy_pass http://objects;
        }
        location ^~ /assets/ { try_files $uri =404; }
        location ~* \.(?:css|js|mjs|wasm|json|bin|png|jpe?g|gif|ico|ttf|map|symbols)$ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }

    server {
        listen 8082;
        listen 8083;
        server_name _;
        root /srv/admin;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        location = /healthz { access_log off; return 200 'ok'; }
        location ^~ /api/v3/admin/ {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            # Port 8082 ignores caller headers; port 8083 receives sanitized
            # forwarding headers through the private Traefik entrypoint.
            proxy_set_header X-Forwarded-For $admin_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass http://api;
        }
        location ^~ /api/ { return 404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
