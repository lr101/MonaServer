name: Go Docker compiler cache
description: Restore and export the BuildKit Go compiler cache between CI runners.
runs:
  using: composite
  steps:
    - name: Restore Go compiler cache
      id: compiler-cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/go-docker-build-cache
        key: ${{ runner.os }}-${{ runner.arch }}-go-docker-v1-${{ hashFiles('go-server/go.sum', 'go-server/Dockerfile') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-go-docker-v1-${{ hashFiles('go-server/go.sum', 'go-server/Dockerfile') }}-
          ${{ runner.os }}-${{ runner.arch }}-go-docker-v1-

    # The normal gha layer exporter does not save RUN --mount=type=cache data.
    - name: Import and export BuildKit cache mount
      uses: reproducible-containers/buildkit-cache-dance@e475a9cbcb5052f85fd3830f1266fa0c91ef8595
      with:
        cache-map: '{"${{ runner.temp }}/go-docker-build-cache": "/root/.cache/go-build"}'
        # Exact reruns cannot update an immutable Actions cache entry.
        skip-extraction: ${{ steps.compiler-cache.outputs.cache-hit == 'true' }}
