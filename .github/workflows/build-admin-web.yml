name: Build admin web Docker image

on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - "admin-web/**"
      - "api/**"
      - ".github/scripts/**"
      - ".github/workflows/build-admin-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-smoke-test:
    name: Build and smoke-test admin web image
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.release_version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read current version
        id: release_version
        run: |
          version="$(bash .github/scripts/read_release_version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check admin web source
        working-directory: admin-web
        run: |
          node --check src/api.js
          node --check src/state.js
          node --check src/view-model.js
          node --check src/main.js
          node --test test/*.test.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build admin web Docker image
        uses: docker/build-push-action@v7
        with:
          context: admin-web
          file: admin-web/Dockerfile
          push: false
          load: true
          tags: admin-web:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release_version.outputs.version }}
          cache-from: type=gha,scope=admin-web
          cache-to: type=gha,mode=max,scope=admin-web

      - name: Smoke-test admin web container
        run: |
          set -euo pipefail
          container_name=admin-web-ci
          docker run --detach --name "$container_name" --publish 18081:80 admin-web:ci
          cleanup() {
            docker rm --force "$container_name" >/dev/null
          }
          trap cleanup EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:18081/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:18081/ \
            | grep -F 'MonaServer Admin' >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18081/src/main.js \
            | grep -F "./api.js" >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18081/dashboard \
            | grep -F 'MonaServer Admin' >/dev/null
          curl --fail --silent --show-error --head http://127.0.0.1:18081/ \
            | grep -i '^X-Content-Type-Options: nosniff' >/dev/null

          status_code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18081/api/health)
          [ "$status_code" = 404 ]

      - name: Save tested admin web image
        if: github.event_name == 'push'
        run: docker save --output "$RUNNER_TEMP/admin-web-image.tar" admin-web:ci

      - name: Upload tested admin web image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: admin-web-image
          path: ${{ runner.temp }}/admin-web-image.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

  publish-admin-web:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: build-and-smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download tested admin web image
        uses: actions/download-artifact@v8
        with:
          name: admin-web-image
          path: ${{ runner.temp }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image without rebuilding
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/stick-it-admin-web
          RELEASE_VERSION: ${{ needs.build-and-smoke-test.outputs.release_version }}
        run: |
          docker load --input "$RUNNER_TEMP/admin-web-image.tar"
          tags="$(bash .github/scripts/release_image_tags.sh "$IMAGE_NAME" "$RELEASE_VERSION" "$GITHUB_REF_NAME")"
          while IFS= read -r tag; do
            docker tag admin-web:ci "$tag"
            docker push "$tag"
          done <<< "$tags"
