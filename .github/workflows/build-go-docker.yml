name: Build Go Docker Image

on:
  pull_request:
    paths:
      - 'go-server/**'
      - 'api/**'
      - 'mise.toml'
      - '.github/actions/go-docker-cache/**'
      - '.github/scripts/**'
      - '.github/workflows/build-go-docker.yml'
      - '.github/workflows/publish-go-docker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-master
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: monatest
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d monatest"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - name: Test container image promotion
        run: bash .github/scripts/test_promote_image_channel.sh

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: go-server/go.sum

      - name: Go vet
        working-directory: go-server
        run: go vet ./...

      - name: Go test (unit + integration)
        working-directory: go-server
        env:
          TEST_DATABASE_URL: postgres://test:testpw@localhost:5432/monatest?sslmode=disable
        run: go test -p 1 ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Go Docker compiler cache
        uses: ./.github/actions/go-docker-cache

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: go-server
          file: go-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=go-server
          cache-to: type=gha,mode=max,scope=go-server
          tags: ghcr.io/${{ github.repository_owner }}/stick-it-server-go:pr
