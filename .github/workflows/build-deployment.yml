name: Build and publish combined deployment

on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - '.env.example'
      - 'deploy/**'
      - 'admin-web/**'
      - 'go-server/**'
      - 'flutter/**'
      - 'api/**'
      - '.github/scripts/**'
      - '.github/workflows/build-deployment.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/monaserver-app

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.release_version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read current version
        id: release_version
        run: |
          version="$(bash .github/scripts/read_release_version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build combined image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: monaserver-app:ci
          cache-from: type=gha,scope=monaserver-app
          cache-to: type=gha,mode=max,scope=monaserver-app

      - name: Start Compose stack and check routes
        shell: bash
        run: |
          set -euo pipefail
          docker network create traefik
          db_password="$(openssl rand -hex 24)"
          cat > .env <<ENV
          APP_IMAGE=monaserver-app:ci
          WEB_HOST=stick-it.lr-projects.de
          ADMIN_HOST=admin.thinkpad.lr-project.de
          TRAEFIK_NETWORK=traefik
          POSTGRES_USER=monaserver
          POSTGRES_PASSWORD=$db_password
          DATABASE_URL=postgres://monaserver:$db_password@db:5432/monaserver?sslmode=disable
          RUSTFS_ACCESS_KEY=$(openssl rand -hex 16)
          RUSTFS_SECRET_KEY=$(openssl rand -hex 32)
          ADMIN_TOTP_ENCRYPTION_KEY=$(openssl rand -hex 32)
          ADMIN_SESSION_HMAC_KEY=$(openssl rand -hex 32)
          ENV
          chmod 600 .env
          cleanup() {
            docker compose down -v --remove-orphans
          }
          trap cleanup EXIT
          docker compose config --quiet
          docker compose up --no-build -d --wait
          echo 'Checking API-backed health route'
          docker compose exec -T app wget -O /dev/null http://127.0.0.1:8081/healthz
          echo 'Checking Flutter Wasm asset'
          docker compose exec -T app wget -O /dev/null http://127.0.0.1:8081/main.dart.wasm
          echo 'Checking loopback admin UI'
          curl --fail --silent --show-error http://127.0.0.1:8082/ \
            | grep -F 'MonaServer Admin' >/dev/null
          echo 'Checking public admin API denial'
          blocked_response="$(printf 'GET /api/v3/admin/users HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' \
            | docker compose exec -T app busybox nc -w 5 127.0.0.1 8081)"
          printf '%s\n' "$blocked_response"
          grep -q 'HTTP/1.1 404' <<< "$blocked_response"
          grep -qi 'X-Admin-Blocked: true' <<< "$blocked_response"

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: build-and-smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare branch tags
        id: image_tags
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          RELEASE_VERSION: ${{ needs.build-and-smoke-test.outputs.release_version }}
        run: |
          {
            echo 'tags<<IMAGE_TAGS_EOF'
            bash .github/scripts/release_image_tags.sh "$IMAGE_NAME" "$RELEASE_VERSION" "$GITHUB_REF_NAME"
            echo 'IMAGE_TAGS_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Publish image with branch tags
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.build-and-smoke-test.outputs.release_version }}
          cache-from: type=gha,scope=monaserver-app
          cache-to: type=gha,mode=max,scope=monaserver-app
