name: Docker Publish (Go)

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
    paths:
      - 'go-server/**'
      - 'api/**'
      - '.github/workflows/publish-go-docker.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/stick-it-server-go

jobs:
  build-and-publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the release commit back to main
      packages: write   # push images to GitHub Container Registry
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: go-server/go.sum


      # Mirror the tagging strategy of the Spring Boot publish workflow:
      #   tag push          -> FINAL_TAG=<base>, also push :latest
      #   main branch push  -> FINAL_TAG=<base>.<run_number>, also push :latest
      #   develop push      -> FINAL_TAG=<base>-SNAPSHOT, also push :snapshot
      - name: Compute version
        id: compute_version
        run: |
          BASE_VERSION=$(grep -m1 -E '^version' go-server/VERSION 2>/dev/null | awk -F'=' '{print $2}' | xargs)
          if [ -z "$BASE_VERSION" ]; then BASE_VERSION="1.0.1"; fi
          if [ "${{ github.ref_type }}" == "tag" ]; then
            FINAL_TAG="${GITHUB_REF_NAME#v}"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "is_snapshot=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" == "main" ]; then
            FINAL_TAG="${BASE_VERSION}.${{ github.run_number }}"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "is_snapshot=false" >> "$GITHUB_OUTPUT"
          else
            FINAL_TAG="${BASE_VERSION}-SNAPSHOT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "is_snapshot=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$FINAL_TAG" >> "$GITHUB_OUTPUT"
          echo "Computed FINAL_TAG=$FINAL_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        uses: docker/build-push-action@v7
        with:
          context: go-server
          file: go-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.compute_version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag and push :latest (Release/Main only)
        if: steps.compute_version.outputs.is_release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: go-server
          file: go-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha

      - name: Tag and push :snapshot (Develop only)
        if: steps.compute_version.outputs.is_snapshot == 'true'
        uses: docker/build-push-action@v7
        with:
          context: go-server
          file: go-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:snapshot
          cache-from: type=gha

      - name: Push Release Commit to Main Branch
        if: github.ref_type == 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:main
