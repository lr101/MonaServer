name: Docker Publish (Go)

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/stick-it-server-go

jobs:
  build-and-publish-image:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.compute_version.outputs.tag }}
    permissions:
      contents: read
      packages: write   # push images to GitHub Container Registry
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: go-server/go.sum

      # Every push to main is a release. The run number keeps image tags unique
      # while :latest points at the most recent main release.
      - name: Compute version
        id: compute_version
        run: |
          BASE_VERSION=$(grep -m1 -E '^version' go-server/VERSION 2>/dev/null | awk -F'=' '{print $2}' | xargs)
          if [ -z "$BASE_VERSION" ]; then BASE_VERSION="1.0.1"; fi
          FINAL_TAG="${BASE_VERSION}.${{ github.run_number }}"
          echo "tag=$FINAL_TAG" >> "$GITHUB_OUTPUT"
          echo "Computed FINAL_TAG=$FINAL_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        uses: docker/build-push-action@v7
        with:
          context: go-server
          file: go-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.compute_version.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote-latest-image:
    needs: build-and-publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote current main image to :latest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            current_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
            if docker buildx imagetools inspect "$IMAGE_NAME:$current_sha" >/dev/null 2>&1; then
              docker buildx imagetools create --tag "$IMAGE_NAME:latest" "$IMAGE_NAME:$current_sha"
              verified_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
              if [ "$verified_sha" = "$current_sha" ]; then
                echo "Promoted $IMAGE_NAME:$current_sha to :latest"
                exit 0
              fi
              echo "::notice::main advanced during promotion; retrying with its current image."
            else
              echo "::notice::The current main image is not available yet; retrying."
            fi
            sleep 10
          done
          echo "::notice::No stable current main image was available; leaving :latest unchanged."
