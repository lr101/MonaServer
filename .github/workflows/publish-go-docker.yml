name: Docker Publish (Go)

on:
  push:
    branches:
      - main
      - develop

concurrency:
  group: go-docker-publish-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/stick-it-server-go

jobs:
  build-and-publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push images to GitHub Container Registry
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Read current version
        id: version
        run: |
          version="$(bash .github/scripts/read_release_version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Go Docker compiler cache
        uses: ./.github/actions/go-docker-cache

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare branch tags
        id: image_tags
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo 'tags<<IMAGE_TAGS_EOF'
            bash .github/scripts/release_image_tags.sh "$IMAGE_NAME" "$RELEASE_VERSION" "$GITHUB_REF_NAME"
            echo 'IMAGE_TAGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: go-server
          file: go-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=go-server
          cache-to: type=gha,mode=max,scope=go-server
