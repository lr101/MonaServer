name: Docker Publish (Go)

on:
  push:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/stick-it-server-go

jobs:
  build-and-publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push images to GitHub Container Registry
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: go-server/go.sum

      # Every push to main is a release. The run number keeps image tags unique
      # while :latest points at the most recent main release.
      - name: Compute version
        if: github.ref == 'refs/heads/main'
        id: compute_version
        run: |
          BASE_VERSION=$(grep -m1 -E '^version' go-server/VERSION 2>/dev/null | awk -F'=' '{print $2}' | xargs)
          if [ -z "$BASE_VERSION" ]; then BASE_VERSION="1.0.1"; fi
          FINAL_TAG="${BASE_VERSION}.${{ github.run_number }}"
          echo "tag=$FINAL_TAG" >> "$GITHUB_OUTPUT"
          echo "Computed FINAL_TAG=$FINAL_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=${{ steps.compute_version.outputs.tag }},enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: go-server
          file: go-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote-channel-image:
    needs: build-and-publish-image
    runs-on: ubuntu-latest
    concurrency:
      group: promote-go-image-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote current branch image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          CHANNEL_TAG: ${{ github.ref == 'refs/heads/main' && 'latest' || 'snapshot' }}
        run: |
          bash .github/scripts/promote_image_channel.sh \
            "$IMAGE_NAME" \
            "$SOURCE_BRANCH" \
            "$CHANNEL_TAG"
