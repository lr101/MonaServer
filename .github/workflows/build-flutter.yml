name: Build and test Flutter app

on:
  push:
    branches: [main, develop]
    # Promotion requires an image for the exact branch HEAD, even after docs pushes.
  pull_request:
    paths:
      - "flutter/**"
      - "api/**"
      - ".github/scripts/**"
      - "mise.toml"
      - "codemagic.yaml"
      - ".github/workflows/build-flutter.yml"
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR checks can stop; publishing/channel promotion must finish.
concurrency:
  group: flutter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-and-build:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test container image promotion
        run: bash .github/scripts/test_promote_image_channel.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true

      - name: Detect API generator changes
        id: generator
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if git diff --quiet "$BASE_SHA" HEAD -- api/ flutter/api/ .github/workflows/build-flutter.yml; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Java for API generation
        if: steps.generator.outputs.changed == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache pinned OpenAPI generator
        if: steps.generator.outputs.changed == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/openapi-generator
          key: openapi-generator-7.9.0

      - name: Check generated Dart API client
        if: steps.generator.outputs.changed == 'true'
        working-directory: flutter
        run: |
          generator="$HOME/.cache/openapi-generator/openapi-generator-cli-7.9.0.jar"
          mkdir -p "$(dirname "$generator")"
          if [ ! -f "$generator" ]; then
            curl --fail --silent --show-error --location \
              https://repo.maven.apache.org/maven2/org/openapitools/openapi-generator-cli/7.9.0/openapi-generator-cli-7.9.0.jar \
              --output "$generator"
          fi
          echo "f0cb7839a2ead9040b204519b03f1473b39c7725fd1f43134bb550515cb3dbee  $generator" | sha256sum --check
          generated_api="$(mktemp -d)"
          trap 'rm -rf "$generated_api"' EXIT
          java -jar "$generator" generate \
            -i ../api/openapi.yaml \
            -g dart \
            -o "$generated_api" \
            --skip-validate-spec
          diff -ru \
            --exclude=pubspec.yaml \
            --exclude=pubspec.lock \
            --exclude=.dart_tool \
            --exclude=build \
            api "$generated_api"

      - name: Install dependencies
        run: |
          cd flutter
          flutter pub get
          cd api
          flutter pub get

      - name: Analyze Dart code
        working-directory: flutter
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Test Flutter app
        working-directory: flutter
        run: flutter test --no-pub

      - name: Test generated Dart API client
        working-directory: flutter/api
        run: flutter test --no-pub

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true

      - name: Build web release
        working-directory: flutter
        run: |
          flutter pub get
          flutter build web --wasm --release --no-pub

      - name: Verify browser-compatible web artifacts
        working-directory: flutter
        run: bash docker/test_web_build.sh build/web

      - name: Upload compiled web app
        uses: actions/upload-artifact@v7
        with:
          name: flutter-web
          path: flutter/build/web
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Add Google services configuration
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -z "$GOOGLE_SERVICES" ]; then
            echo "::notice::GOOGLE_SERVICES is unavailable; using a CI-only Firebase configuration for the compile check."
            printf '%s' '{
              "project_info": {
                "project_number": "000000000000",
                "project_id": "stick-it-ci",
                "storage_bucket": "stick-it-ci.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                    "android_client_info": {
                      "package_name": "com.TheGermanApps.buff_lisa"
                    }
                  },
                  "api_key": [
                    {
                      "current_key": "ci-placeholder"
                    }
                  ],
                  "services": {
                    "appinvite_service": {
                      "status": 2,
                      "other_platform_oauth_client": []
                    }
                  }
                }
              ],
              "configuration_version": "1"
            }' > flutter/android/app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES" | base64 --decode > flutter/android/app/google-services.json
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build Android APK
        working-directory: flutter
        run: |
          flutter pub get
          flutter build apk --debug --no-pub

  validate-web-container:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download compiled web app
        uses: actions/download-artifact@v8
        with:
          name: flutter-web
          path: flutter/build/web

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract web image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: stick-it-web
          tags: type=raw,value=ci

      - name: Package compiled web app
        uses: docker/build-push-action@v7
        with:
          context: flutter
          file: flutter/docker/Dockerfile.runtime
          push: false
          load: true
          tags: stick-it-web:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=flutter-web-runtime
          cache-to: type=gha,mode=max,scope=flutter-web-runtime

      - name: Smoke test web container
        run: |
          set -euo pipefail
          container_name=stick-it-web-ci
          docker run --detach --name "$container_name" --publish 18080:80 stick-it-web:ci
          cleanup() {
            docker rm --force "$container_name" >/dev/null
          }
          trap cleanup EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:18080/assets/config \
            | grep -q '^API_HOST='
          curl --fail --silent --show-error http://127.0.0.1:18080/assets/config.dev \
            | grep -q '^API_HOST='
          curl --fail --silent --show-error http://127.0.0.1:18080/main.dart.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/main.dart.mjs >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/main.dart.wasm >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/assets/assets/icon/logo-rounded-corners.png >/dev/null
          curl --fail --silent --show-error --head http://127.0.0.1:18080/main.dart.mjs \
            | grep -qi '^Content-Type: application/javascript'
          curl --fail --silent --show-error --head http://127.0.0.1:18080/main.dart.wasm \
            | grep -qi '^Content-Type: application/wasm'

          for static_path in /assets/missing-config /missing.js /missing.css /missing.map /missing.symbols; do
            status_code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "http://127.0.0.1:18080$static_path")
            [ "$status_code" = 404 ]
          done

      - name: Save tested web image
        if: github.event_name == 'push'
        run: docker save --output "$RUNNER_TEMP/flutter-web-image.tar" stick-it-web:ci

      - name: Upload tested web image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: flutter-web-image
          path: ${{ runner.temp }}/flutter-web-image.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

  build-ios:
    runs-on: macos-15
    env:
      # Flutter 3.44+ uses Swift Package Manager for compatible plugins and
      # falls back to CocoaPods only for plugins that still require it.
      FLUTTER_SWIFT_PACKAGE_MANAGER: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true

      - name: Select Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Build iOS release
        working-directory: flutter
        run: flutter build ios --release --no-codesign --no-pub

  publish-web:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [analyze-and-build, validate-web-container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download tested web image
        uses: actions/download-artifact@v8
        with:
          name: flutter-web-image
          path: ${{ runner.temp }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image without rebuilding
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/stick-it-web
        run: |
          docker load --input "$RUNNER_TEMP/flutter-web-image.tar"
          docker tag stick-it-web:ci "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:$GITHUB_SHA"

  promote-web-image:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: publish-web
    runs-on: ubuntu-latest
    concurrency:
      group: promote-web-image-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote current branch image
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/stick-it-web
          SOURCE_BRANCH: ${{ github.ref_name }}
          CHANNEL_TAG: ${{ github.ref == 'refs/heads/main' && 'main' || 'snapshot' }}
        run: |
          bash .github/scripts/promote_image_channel.sh \
            "$WEB_IMAGE" \
            "$SOURCE_BRANCH" \
            "$CHANNEL_TAG"
