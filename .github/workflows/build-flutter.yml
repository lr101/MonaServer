name: Build and test Flutter app

on:
  push:
    paths:
      - "flutter/**"
      - "api/**"
      - ".github/workflows/build-flutter.yml"
  pull_request:
    paths:
      - "flutter/**"
      - "api/**"
      - ".github/workflows/build-flutter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Add Google services configuration
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -z "$GOOGLE_SERVICES" ]; then
            echo "::notice::GOOGLE_SERVICES is unavailable; using a CI-only Firebase configuration for the compile check."
            printf '%s' '{
              "project_info": {
                "project_number": "000000000000",
                "project_id": "stick-it-ci",
                "storage_bucket": "stick-it-ci.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                    "android_client_info": {
                      "package_name": "com.TheGermanApps.buff_lisa"
                    }
                  },
                  "api_key": [
                    {
                      "current_key": "ci-placeholder"
                    }
                  ],
                  "services": {
                    "appinvite_service": {
                      "status": 2,
                      "other_platform_oauth_client": []
                    }
                  }
                }
              ],
              "configuration_version": "1"
            }' > flutter/android/app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES" | base64 --decode > flutter/android/app/google-services.json
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Check generated Dart API client
        working-directory: flutter
        run: |
          flutter pub global activate openapi_generator_cli
          generated_api="$(mktemp -d)"
          trap 'rm -rf "$generated_api"' EXIT
          flutter pub global run openapi_generator_cli:main generate \
            -i ../api/openapi.yaml \
            -g dart \
            -o "$generated_api" \
            --skip-validate-spec
          diff -ru \
            --exclude=pubspec.yaml \
            --exclude=pubspec.lock \
            --exclude=.dart_tool \
            --exclude=build \
            api "$generated_api"

      - name: Install dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: flutter
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Test Flutter app
        working-directory: flutter
        run: flutter test --no-pub

      - name: Test generated Dart API client
        working-directory: flutter/api
        run: flutter pub get && flutter test

      - name: Build web release
        working-directory: flutter
        run: flutter build web --wasm --release --no-pub

      - name: Verify browser-compatible web artifacts
        working-directory: flutter
        run: bash docker/test_web_build.sh build/web

      - name: Build Android APK
        working-directory: flutter
        run: flutter build apk --debug --no-pub

  validate-web-container:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build web container
        uses: docker/build-push-action@v7
        with:
          context: flutter
          file: flutter/docker/Dockerfile
          push: false
          load: true
          tags: stick-it-web:ci

      - name: Smoke test web container
        run: |
          set -euo pipefail
          container_name=stick-it-web-ci
          docker run --detach --name "$container_name" --publish 18080:80 stick-it-web:ci
          cleanup() {
            docker rm --force "$container_name" >/dev/null
          }
          trap cleanup EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:18080/assets/config \
            | grep -q '^API_HOST='
          curl --fail --silent --show-error http://127.0.0.1:18080/assets/config.dev \
            | grep -q '^API_HOST='
          curl --fail --silent --show-error http://127.0.0.1:18080/main.dart.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/main.dart.mjs >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/main.dart.wasm >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/assets/assets/icon/logo-rounded-corners.png >/dev/null
          curl --fail --silent --show-error --head http://127.0.0.1:18080/main.dart.mjs \
            | grep -qi '^Content-Type: application/javascript'
          curl --fail --silent --show-error --head http://127.0.0.1:18080/main.dart.wasm \
            | grep -qi '^Content-Type: application/wasm'

          for static_path in /assets/missing-config /missing.js /missing.css /missing.map /missing.symbols; do
            status_code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "http://127.0.0.1:18080$static_path")
            [ "$status_code" = 404 ]
          done

  build-ios:
    runs-on: macos-15
    env:
      # Flutter 3.44+ uses Swift Package Manager for compatible plugins and
      # falls back to CocoaPods only for plugins that still require it.
      FLUTTER_SWIFT_PACKAGE_MANAGER: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - name: Select Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Build iOS release
        working-directory: flutter
        run: flutter build ios --release --no-codesign --no-pub

  publish-web:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [analyze-and-build, validate-web-container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract web image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/stick-it-web

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: flutter
          file: flutter/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
