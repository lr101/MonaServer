name: Build and test Flutter app

on:
  push:
    branches:
      - "**"
  pull_request:
    paths:
      - "flutter/**"
      - "api/**"
      - "go-server/**"
      - "mise.toml"
      - ".mcp.json"
      - ".github/workflows/build-flutter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-master@sha256:d47fe8c1bf27fa2a498899e7a2bc572af002a7f882b91c07795f0509f96ef027
        env:
          POSTGRES_DB: monaserver_test
          POSTGRES_USER: monaserver
          POSTGRES_PASSWORD: monaserver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monaserver -d monaserver_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
          cache-dependency-path: go-server/go.sum

      - name: Start disposable test API
        working-directory: go-server
        env:
          DATABASE_URL: postgres://monaserver:monaserver@127.0.0.1:5432/monaserver_test?sslmode=disable
          JWT_SECRET: ci-only-test-secret
          PORT: "8080"
          TOKEN_ADMIN_USERNAME: __ci_admin_disabled__
        run: |
          set -euo pipefail
          go run ./cmd/server > "$RUNNER_TEMP/stick-it-api.log" 2>&1 &
          api_pid=$!
          echo "$api_pid" > "$RUNNER_TEMP/stick-it-api.pid"

          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/public/api-docs >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/stick-it-api.log"
              exit 1
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/stick-it-api.log"
          exit 1

      - name: Add Google services configuration
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -z "$GOOGLE_SERVICES" ]; then
            echo "::notice::GOOGLE_SERVICES is unavailable; using a CI-only Firebase configuration for the compile check."
            printf '%s' '{
              "project_info": {
                "project_number": "000000000000",
                "project_id": "stick-it-ci",
                "storage_bucket": "stick-it-ci.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                    "android_client_info": {
                      "package_name": "com.TheGermanApps.buff_lisa"
                    }
                  },
                  "api_key": [
                    {
                      "current_key": "ci-placeholder"
                    }
                  ],
                  "services": {
                    "appinvite_service": {
                      "status": 2,
                      "other_platform_oauth_client": []
                    }
                  }
                }
              ],
              "configuration_version": "1"
            }' > flutter/android/app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES" | base64 --decode > flutter/android/app/google-services.json
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Check generated Dart API client
        working-directory: flutter
        run: |
          flutter pub global activate openapi_generator_cli
          generated_api="$(mktemp -d)"
          trap 'rm -rf "$generated_api"' EXIT
          flutter pub global run openapi_generator_cli:main generate \
            -i ../api/openapi.yaml \
            -g dart \
            -o "$generated_api" \
            --skip-validate-spec
          diff -ru \
            --exclude=pubspec.yaml \
            --exclude=pubspec.lock \
            --exclude=.dart_tool \
            --exclude=build \
            api "$generated_api"

      - name: Install dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: flutter
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Test Flutter app
        working-directory: flutter
        run: flutter test --no-pub

      - name: Test generated Dart API client
        working-directory: flutter/api
        run: flutter pub get && flutter test

      - name: Build web release
        working-directory: flutter
        run: flutter build web --wasm --release --no-pub --dart-define=API_HOST=http://127.0.0.1:8080

      - name: Verify browser-compatible web artifacts
        working-directory: flutter
        run: bash docker/test_web_build.sh build/web

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: flutter/e2e/package-lock.json

      - name: Install Playwright dependencies
        working-directory: flutter/e2e
        run: npm ci && npm run install:browsers

      - name: Verify Flutter web user flow in Chromium
        working-directory: flutter/e2e
        env:
          E2E_API_URL: http://127.0.0.1:8080
        run: npm test

      - name: Build Android APK
        working-directory: flutter
        run: flutter build apk --debug --no-pub

  validate-web-container:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build web container
        uses: docker/build-push-action@v7
        with:
          context: flutter
          file: flutter/docker/Dockerfile
          push: false
          load: true
          tags: stick-it-web:ci

      - name: Smoke test web container
        run: |
          set -euo pipefail
          container_name=stick-it-web-ci
          docker run --detach --name "$container_name" --publish 18080:80 stick-it-web:ci
          cleanup() {
            docker rm --force "$container_name" >/dev/null
          }
          trap cleanup EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:18080/assets/config \
            | grep -q '^API_HOST='
          curl --fail --silent --show-error http://127.0.0.1:18080/assets/config.dev \
            | grep -q '^API_HOST='
          curl --fail --silent --show-error http://127.0.0.1:18080/main.dart.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/main.dart.mjs >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/main.dart.wasm >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/assets/assets/icon/logo-rounded-corners.png >/dev/null
          curl --fail --silent --show-error --head http://127.0.0.1:18080/main.dart.mjs \
            | grep -qi '^Content-Type: application/javascript'
          curl --fail --silent --show-error --head http://127.0.0.1:18080/main.dart.wasm \
            | grep -qi '^Content-Type: application/wasm'

          for static_path in /assets/missing-config /missing.js /missing.css /missing.map /missing.symbols; do
            status_code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "http://127.0.0.1:18080$static_path")
            [ "$status_code" = 404 ]
          done
  build-ios:
    runs-on: macos-15
    env:
      # Flutter 3.44+ uses Swift Package Manager for compatible plugins and
      # falls back to CocoaPods only for plugins that still require it.
      FLUTTER_SWIFT_PACKAGE_MANAGER: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2

      - name: Select Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Build iOS release
        working-directory: flutter
        run: flutter build ios --release --no-codesign --no-pub

  publish-web:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [analyze-and-build, validate-web-container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract web image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/stick-it-web
          tags: |
            type=raw,value=${{ github.sha }}

      - name: Build and push immutable web image
        uses: docker/build-push-action@v7
        with:
          context: flutter
          file: flutter/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  promote-web-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote current main image to :main
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/stick-it-web
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            current_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
            if docker buildx imagetools inspect "$WEB_IMAGE:$current_sha" >/dev/null 2>&1; then
              docker buildx imagetools create --tag "$WEB_IMAGE:main" "$WEB_IMAGE:$current_sha"
              verified_sha="$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq '.object.sha')"
              if [ "$verified_sha" = "$current_sha" ]; then
                echo "Promoted $WEB_IMAGE:$current_sha to :main"
                exit 0
              fi
              echo "::notice::main advanced during promotion; retrying with its current image."
            else
              echo "::notice::The current main image is not available yet; retrying."
            fi
            sleep 10
          done
          echo "::notice::No stable current main image was available; leaving :main unchanged."
