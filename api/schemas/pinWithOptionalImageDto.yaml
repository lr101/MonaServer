type: object
required:
  - id
  - creationDate
  - creationUser
  - latitude
  - longitude
  - groupId
properties:
  id:
    $ref: '../parameters/id.yaml'
  creationDate:
    $ref: '../parameters/date.yaml'
  latitude:
    $ref: '../parameters/latitude.yaml'
  longitude:
    $ref: '../parameters/longitude.yaml'
  creationUser:
    $ref: '../parameters/id.yaml'
  image:
    $ref: '../parameters/imageUrl.yaml'
  imageBlurhash:
    type: string
    minLength: 16
    maxLength: 16
    description: Compact BlurHash placeholder for the pin image.
  groupId:
    $ref: '../parameters/id.yaml'
  title:
    $ref: '../parameters/pinTitle.yaml'
  description:
    $ref: '../parameters/veryLongStringNullable.yaml'
  isGone:
    type: boolean
    default: false
    nullable: true
