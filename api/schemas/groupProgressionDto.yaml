type: object
required:
  - groupId
  - totalXp
  - currentLevel
  - currentLevelXp
  - nextLevelXp
properties:
  groupId:
    type: string
    format: uuid
  totalXp:
    type: integer
    minimum: 0
  currentLevel:
    type: integer
    minimum: 1
  currentLevelXp:
    type: integer
    minimum: 0
  nextLevelXp:
    type: integer
    minimum: 0
