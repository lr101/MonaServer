type: object
required:
  - id
  - pinId
  - contributorUsername
  - observedAt
  - isOriginal
properties:
  id:
    type: string
    format: uuid
  pinId:
    type: string
    format: uuid
  contributorId:
    type: string
    format: uuid
    nullable: true
  contributorUsername:
    type: string
  image:
    type: string
    format: url
    nullable: true
  caption:
    type: string
    nullable: true
  observedAt:
    type: string
    format: date-time
  isOriginal:
    type: boolean
