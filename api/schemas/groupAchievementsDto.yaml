type: array
items:
  type: object
  required:
    - achievementId
    - claimed
    - claimable
    - thresholdValue
    - currentValue
    - thresholdUp
  properties:
    achievementId:
      type: integer
      minimum: 1
    name:
      type: string
    description:
      type: string
    track:
      type: string
    difficulty:
      type: string
      enum: [easy, medium, hard]
    claimed:
      type: boolean
    claimable:
      type: boolean
    thresholdValue:
      type: integer
      minimum: 1
    currentValue:
      type: integer
      minimum: 0
    thresholdUp:
      type: boolean
    rewardType:
      type: string
      enum: [xp, color, badge]
      description: Each group achievement grants exactly one reward category based on its difficulty.
    rewardColor:
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
      description: Color granted by medium difficulty achievements.
    rewardPinStyle:
      type: string
      enum: [moss, sunset, aurora, seafoam, honey, orchid, copper, jade, ember, glacier, rose, midnight]
      description: Color preset for color rewards or badge design for badge rewards.
    rewardXp:
      type: integer
      description: Group XP amount for XP rewards; omitted for color and badge rewards.
