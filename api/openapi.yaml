components:
  parameters:
    adminCursor:
      description: Opaque cursor returned by the preceding page.
      in: query
      name: cursor
      required: false
      schema:
        maxLength: 512
        type: string
    adminLimit:
      description: Maximum number of records in the page; defaults to 25 and is capped at 100.
      in: query
      name: limit
      required: false
      schema:
        default: 25
        maximum: 100
        minimum: 1
        type: integer
    csrfHeader:
      description: Double-submit CSRF value issued by the admin session bootstrap and rotated after MFA or reauthentication.
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        maxLength: 256
        minLength: 16
        type: string
    idempotencyKey:
      description: Client-generated business key; reusing it with a different payload returns 409.
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 128
        minLength: 8
        type: string
    reportIdempotencyKey:
      description: Optional client-generated key; replaying it with a different report returns 409.
      in: header
      name: Idempotency-Key
      required: false
      schema:
        maxLength: 255
        type: string
  responses:
    badRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/apiErrorDto"
      description: Request is malformed or a token/action is invalid.
    unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/apiErrorDto"
      description: Authentication is missing, expired, revoked, or invalid.
    forbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/apiErrorDto"
      description: The authenticated principal lacks the required capability.
    notFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/apiErrorDto"
      description: The resource is absent or not visible to the caller.
    conflict:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/apiErrorDto"
      description: Revision, payload, audience, or idempotency key conflicts with current state.
    rateLimited:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/apiErrorDto"
      description: Shared rate limit exceeded; response is membership independent.
      headers:
        Retry-After:
          description: Number of seconds before retrying.
          schema:
            minimum: 0
            type: integer
    unavailable:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/apiErrorDto"
      description: Feature is disabled or a required local provider is unavailable.
  schemas:
    apiErrorDto:
      description: Stable, non-secret error envelope shared by v3 endpoints.
      example:
        code: invalid_request
        message: The request could not be accepted.
        retryAfterSeconds: 30
      properties:
        code:
          maxLength: 64
          type: string
        message:
          maxLength: 256
          type: string
        retryAfterSeconds:
          minimum: 0
          nullable: true
          type: integer
      required:
      - code
      - message
      type: object
    emailLinkRequestDto:
      description: Email-only login request. Surrounding whitespace is trimmed by the service.
      example:
        email: person@example.com
      properties:
        email:
          format: email
          maxLength: 320
          type: string
      required:
      - email
      type: object
    emailLinkRequestAcceptedDto:
      description: Generic response intentionally independent of account eligibility.
      example:
        accepted: true
      properties:
        accepted:
          enum:
          - true
          type: boolean
      required:
      - accepted
      type: object
    emailLinkExchangeRequestDto:
      description: Opaque one-time token captured from the browser fragment and submitted by POST.
      example:
        token: opaque-token-kept-out-of-logs
      properties:
        token:
          maxLength: 512
          minLength: 16
          type: string
      required:
      - token
      type: object
    emailLinkExchangeResponseDto:
      description: Existing consumer token pair plus the authoritative canonical username.
      example:
        tokens:
          accessToken: access-token
          refreshToken: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          userId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        username: alice
      properties:
        tokens:
          $ref: "#/components/schemas/tokenResponseDto"
        username:
          maxLength: 256
          type: string
      required:
      - tokens
      - username
      type: object
    recoveryCompleteRequestDto:
      description: Purpose-limited restricted recovery submission; it does not accept or create a normal JWT.
      example:
        password: a-new-password
        token: opaque-recovery-token
      properties:
        password:
          maxLength: 256
          minLength: 8
          type: string
        token:
          maxLength: 512
          minLength: 16
          type: string
      required:
      - password
      - token
      type: object
    sessionRevokeRequestDto:
      description: Refresh credential to revoke; the bearer identity must own it.
      example:
        refreshToken: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        refreshToken:
          format: uuid
          type: string
      required:
      - refreshToken
      type: object
    adminSessionState:
      enum:
      - pre_authentication
      - mfa_required
      - authenticated
      type: string
    adminSessionBootstrapDto:
      description: Pre-authentication state created before password login; the CSRF value is bound to its challenge cookie.
      example:
        csrfToken: csrf-bootstrap-value
        expiresAt: 2026-09-14T12:30:00Z
        sessionState: pre_authentication
      properties:
        csrfToken:
          maxLength: 256
          minLength: 16
          type: string
        expiresAt:
          format: date-time
          type: string
        sessionState:
          $ref: "#/components/schemas/adminSessionState"
      required:
      - csrfToken
      - expiresAt
      - sessionState
      type: object
    adminSessionLoginRequestDto:
      description: Admin credentials for the password challenge. Consumer credentials never grant this session.
      example:
        password: password-kept-out-of-logs
        username: operator
      properties:
        password:
          maxLength: 256
          minLength: 8
          type: string
        username:
          maxLength: 256
          minLength: 1
          type: string
      required:
      - password
      - username
      type: object
    adminSessionLoginResponseDto:
      description: One-use password challenge awaiting TOTP completion.
      example:
        challengeId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        csrfToken: csrf-login-value
        expiresAt: 2026-09-14T12:05:00Z
        sessionState: mfa_required
      properties:
        challengeId:
          format: uuid
          type: string
        csrfToken:
          maxLength: 256
          minLength: 16
          type: string
        expiresAt:
          format: date-time
          type: string
        sessionState:
          enum:
          - mfa_required
          type: string
      required:
      - challengeId
      - csrfToken
      - expiresAt
      - sessionState
      type: object
    adminMfaRequestDto:
      description: One-use TOTP challenge response.
      example:
        challengeId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        code: '123456'
      properties:
        challengeId:
          format: uuid
          type: string
        code:
          maxLength: 32
          minLength: 6
          type: string
      required:
      - challengeId
      - code
      type: object
    adminReauthenticateRequestDto:
      description: Recent MFA proof bound to one sensitive action.
      example:
        action: mark_compromised
        code: '123456'
      properties:
        action:
          $ref: "#/components/schemas/adminActionKind"
        code:
          maxLength: 32
          minLength: 6
          type: string
      required:
      - action
      - code
      type: object
    adminSessionDto:
      description: Opaque browser admin session state restored by GET; no consumer JWT or refresh credential is included.
      example:
        authenticatedAt: 2026-09-14T04:00:00Z
        capabilities:
        - users.read
        - security.revoke
        csrfToken: csrf-authenticated-value
        idleExpiresAt: 2026-09-14T04:30:00Z
        lastActivityAt: 2026-09-14T04:10:00Z
        permissions:
        - users.read
        recentMfaAt: 2026-09-14T04:10:00Z
        sessionId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        sessionState: authenticated
        userId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        username: operator
      properties:
        authenticatedAt:
          format: date-time
          type: string
        capabilities:
          items:
            maxLength: 128
            type: string
          maxItems: 100
          type: array
        csrfToken:
          maxLength: 256
          minLength: 16
          type: string
        idleExpiresAt:
          format: date-time
          type: string
        lastActivityAt:
          format: date-time
          type: string
        permissions:
          items:
            maxLength: 128
            type: string
          maxItems: 100
          type: array
        recentMfaAt:
          format: date-time
          nullable: true
          type: string
        sessionId:
          format: uuid
          type: string
        sessionState:
          enum:
          - authenticated
          type: string
        userId:
          format: uuid
          type: string
        username:
          maxLength: 256
          type: string
      required:
      - authenticatedAt
      - capabilities
      - csrfToken
      - idleExpiresAt
      - lastActivityAt
      - permissions
      - sessionId
      - sessionState
      - userId
      - username
      type: object
    adminActionKind:
      enum:
      - email
      - login_link
      - push
      - revoke_sessions
      - mark_compromised
      - recovery_resend
      - report_resolve
      - report_dismiss
      - jobs.control
      - messages.test
      - reports.review
      type: string
    audienceKind:
      enum:
      - selected
      - filter
      - all
      type: string
    audienceResourceKind:
      enum:
      - accounts
      - reports
      type: string
    adminSecurityState:
      enum:
      - normal
      - password_disabled
      - compromised
      - secured_manual_recovery_required
      - deleted
      type: string
    adminJobStatus:
      enum:
      - pending
      - running
      - completed
      - completed_with_errors
      - paused
      - cancelled
      type: string
    adminReportStatus:
      enum:
      - open
      - resolved
      - dismissed
      type: string
