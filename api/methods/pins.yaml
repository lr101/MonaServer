post:
  operationId: createPin
  parameters:
    - in: header
      name: Idempotency-Key
      required: false
      description: Stable UUID for safely retrying this pin creation.
      schema:
        type: string
        maxLength: 36
  security:
    - token: [ ]
  summary: Create a new pin
  tags:
    - pins
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/pinRequestDto.yaml'
  responses:
    '201':
      description: Created pin, or the original pin for a matching retry
      content:
        application/json:
          schema:
            $ref: '../schemas/pinWithOptionalImageDto.yaml'
    '409':
      description: Key reused for a different request, or pin already exists
