get:
  operationId: getUserAchievements
  security:
    - token: [ ]
  summary: Get user's achievements
  tags:
    - users
  parameters:
    - name: userId
      in: path
      schema:
        $ref: '../parameters/id.yaml'
  responses:
    '200':
      description: Returns all achievement progress to the owner and earned achievements to other authenticated users
      content:
        application/json:
          schema:
            $ref: '../schemas/userAchievementsDto.yaml'
    404:
      description: User not found
