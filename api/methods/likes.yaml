post:
  operationId: createOrUpdateLike
  summary: Create or update a like
  description: Create or update a like for the original pin photo or a selected update photo.
  security:
    - token: [ ]
  tags:
    - likes
  parameters:
    - name: pinId
      in: path
      description: Original pin ID or update photo ID.
      required: true
      schema:
        $ref: '../parameters/id.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/createLikeDto.yaml'
  responses:
    '201':
      description: Created or updated
      content:
        application/json:
          schema:
            $ref: '../schemas/pinLikeDto.yaml'
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '400':
      description: Bad request
    404:
      description: Pin not found

get:
  operationId: getPinLikes
  summary: Get pin likes
  description: Get likes for the original pin photo or a selected update photo.
  security:
    - token: [ ]
  tags:
    - likes
  parameters:
    - name: pinId
      in: path
      description: Original pin ID or update photo ID.
      required: true
      schema:
        $ref: '../parameters/id.yaml'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../schemas/pinLikeDto.yaml'
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '400':
      description: Bad request
    404:
      description: Pin not found
