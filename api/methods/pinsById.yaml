get:
  operationId: getPin
  security:
    - token: [ ]
  summary: Get pin information by ID
  tags:
    - pins
  parameters:
    - name: pinId
      in: path
      required: true
      schema:
        $ref: '../parameters/id.yaml'
    - name: withImage
      in: query
      description: Describes if the image of the pin should be returned too
      schema:
        type: boolean
        default: false
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '../schemas/pinWithOptionalImageDto.yaml'
    404:
      description: Pin does not exist
      content:
        text/plain; charset=utf-8:
          schema:
            $ref: '../parameters/longString.yaml'
delete:
  operationId: deletePin
  security:
    - token: [ ]
  summary: Delete a pin by ID
  tags:
    - pins
  parameters:
    - name: pinId
      in: path
      required: true
      schema:
        $ref: '../parameters/id.yaml'
  responses:
    '200':
      description: successfully deleted
    404:
      description: Pin does not exist
      content:
        text/plain; charset=utf-8:
          schema:
            $ref: '../parameters/longString.yaml'
post:
  operationId: setPinPresence
  security:
    - token: [ ]
  summary: Set whether the pin is still present
  tags:
    - pins
  parameters:
    - name: pinId
      in: path
      required: true
      schema:
        $ref: '../parameters/id.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/pinPresenceRequestDto.yaml'
  responses:
    '200':
      description: Updated pin presence
      content:
        application/json:
          schema:
            $ref: '../schemas/pinWithOptionalImageDto.yaml'
    '400':
      description: Invalid presence status
    '403':
      description: Pin is not visible to the current user
    '404':
      description: Pin does not exist
