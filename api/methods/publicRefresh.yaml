post:
  operationId: refreshToken
  summary: Request a new access token
  description: Request a new access token with a refresh token
  tags:
    - auth
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../schemas/refreshTokenRequestDto.yaml'
  responses:
    '201':
      description: Successfully applied new access token
      content:
        application/json:
          schema:
            $ref: '../schemas/tokenResponseDto.yaml'
    '400':
      description: Refresh credentials are invalid or revoked
    '403':
      description: The account email is not confirmed
    '410':
      description: The refresh token has expired
      content:
        text/plain:
          schema:
            type: string
            enum:
              - refresh token expired
