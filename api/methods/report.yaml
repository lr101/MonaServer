post:
  operationId: createReport
  tags:
    - report
  security:
    - token: [ ]
  summary: Report content
  parameters:
    - description: Optional client-generated key; replaying it with a different report returns 409.
      in: header
      name: Idempotency-Key
      required: false
      schema:
        maxLength: 255
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/reportDto.yaml'
  responses:
    '200':
      description: Report submitted successfully
    '409':
      description: The idempotency key conflicts with a previously submitted report.
    '429':
      description: Shared report submission rate limit exceeded.
    '400':
      description: User not found
    '503':
      description: Mail service at the moment not reachable
