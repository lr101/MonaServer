post:
  operationId: createUser
  summary: User registration
  description: >-
    Email signups stay pending until the address is confirmed. Before activation,
    repeating this request with the same username and password can resend the
    confirmation link or correct the email address after a five-minute cooldown.
  tags:
    - auth
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/userRequestDto.yaml'
  responses:
    '201':
      description: User registered successfully
      content:
        application/json:
          schema:
            $ref: '../schemas/tokenResponseDto.yaml'
    '400':
      description: Registration failed
    '409':
      description: Username already exists
    '429':
      description: A verification email was sent recently; retry after five minutes
    '503':
      description: Email delivery is unavailable
