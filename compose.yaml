name: monaserver
services:
  app:
    image: ${APP_IMAGE:-ghcr.io/lr101/monaserver-app:develop}
    build:
      context: .
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: .env
    environment:
      PORT: "8080"
      TRUSTED_PROXY_CIDRS: 127.0.0.1/32
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ADMIN_TOTP_ENCRYPTION_KEY: ${ADMIN_TOTP_ENCRYPTION_KEY:?Set ADMIN_TOTP_ENCRYPTION_KEY}
      ADMIN_SESSION_HMAC_KEY: ${ADMIN_SESSION_HMAC_KEY:?Set ADMIN_SESSION_HMAC_KEY}
      RUSTFS_ENDPOINT: rustfs:9000
      RUSTFS_EXTERNAL_ENDPOINT: https://${WEB_HOST:?Set WEB_HOST}
      RUSTFS_USE_SSL: "false"
      RUSTFS_BUCKET: monaserver
      ADMIN_ORIGIN: https://${ADMIN_HOST:?Set ADMIN_HOST in .env}
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      - internal
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.monaserver.rule: Host(`${WEB_HOST:?Set WEB_HOST}`)
      traefik.http.routers.monaserver.entrypoints: websecure
      traefik.http.routers.monaserver.tls: "true"
      traefik.http.routers.monaserver.service: monaserver-web
      traefik.http.services.monaserver-web.loadbalancer.server.port: "8081"
      traefik.http.routers.monaserver-admin.rule: Host(`${ADMIN_HOST:?Set ADMIN_HOST}`)
      traefik.http.routers.monaserver-admin.entrypoints: ${ADMIN_TRAEFIK_ENTRYPOINT:-websecure-internal}
      traefik.http.routers.monaserver-admin.tls: "true"
      traefik.http.routers.monaserver-admin.service: monaserver-admin
      traefik.http.services.monaserver-admin.loadbalancer.server.port: "8083"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: monaserver
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.12
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - rustfs-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
networks:
  internal:
    internal: true
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
volumes:
  db-data:
  rustfs-data:
