<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Delete Account</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <style>
        body { background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .delete-account-box { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .delete-account-box button { width: 100%; }
    </style>
</head>
<body>
<div class="delete-account-box">
    <h3 class="text-danger">Delete Account</h3>
    <form id="form">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" class="form-control" placeholder="Enter your username">
        </div>
        <button id="submitBtn" type="button" onclick="requestDeleteCode()" class="btn btn-danger">Request Delete Code</button>
    </form>
    <div id="successMessage" class="alert alert-success mt-3 mb-0" style="display:none;">Code has been sent. Check your email.</div>
    <div id="errorMessage" class="alert alert-danger mt-3 mb-0" style="display:none;"></div>
    <div id="validationMessage" class="alert alert-warning mt-3 mb-0" style="display:none;">Please enter your username.</div>
</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
function requestDeleteCode() {
    const success = document.getElementById("successMessage");
    const error = document.getElementById("errorMessage");
    const validation = document.getElementById("validationMessage");
    const btn = document.getElementById("submitBtn");
    success.style.display = "none";
    error.style.display = "none";
    validation.style.display = "none";

    const username = document.getElementById("username").value.trim();
    if (!username) {
        validation.style.display = "block";
        return;
    }

    btn.disabled = true;
    btn.textContent = "Sending…";
    $.ajax({
        url: `/api/v2/public/delete-code/${encodeURIComponent(username)}`,
        type: 'GET',
        dataType: 'text',
        success: function () {
            document.getElementById("form").remove();
            success.style.display = "block";
        },
        error: function (jqXHR) {
            let msg;
            if (jqXHR.status === 404) {
                msg = "No account found with that username.";
            } else if (jqXHR.status === 400) {
                msg = "This account has no email address, so a code can’t be sent.";
            } else {
                msg = "Something went wrong. Please try again in a moment.";
            }
            error.textContent = msg;
            error.style.display = "block";
            btn.disabled = false;
            btn.textContent = "Request Delete Code";
        }
    });
}
</script>
</body>
</html>
