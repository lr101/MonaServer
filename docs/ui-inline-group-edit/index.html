<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;color:var(--foreground);font-family:var(--font-sans)}nav{display:flex;gap:8px;margin-bottom:12px}button{font:inherit;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--secondary);color:var(--foreground);cursor:pointer}button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground)}img{display:none;width:100%;max-width:360px;border:1px solid var(--border);border-radius:12px}img.active{display:block}</style></head><body><nav><button data-view="form" aria-pressed="true">Admin form</button><button data-view="actions" aria-pressed="false">Save and actions</button></nav><img data-shot="form" class="active" src="/root/.t3/worktrees/MonaServer/t3-4b55c528/docs/ui-inline-group-edit/admin-settings-top.png" alt="Editable group photo, name, description, website and visibility directly on Group settings"><img data-shot="actions" src="/root/.t3/worktrees/MonaServer/t3-4b55c528/docs/ui-inline-group-edit/admin-settings-actions.png" alt="Group admin selection, Save changes, sharing, report and leave on the same page"><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelectorAll('img').forEach(x=>x.classList.toggle('active',x.dataset.shot===b.dataset.view))});</script></body></html>
