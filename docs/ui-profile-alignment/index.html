<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;color:var(--foreground);font-family:var(--font-sans)}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button{font:inherit;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--secondary);color:var(--foreground);cursor:pointer}button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground)}img{display:none;width:100%;max-width:360px;border:1px solid var(--border);border-radius:12px}img.active{display:block}</style></head><body><nav><button data-view="group" aria-pressed="true">Group profile</button><button data-view="user" aria-pressed="false">User profile</button><button data-view="settings" aria-pressed="false">Group settings</button></nav><img data-shot="group" class="active" src="/root/.t3/worktrees/MonaServer/t3-4b55c528/docs/ui-profile-alignment/group-profile.png" alt="Group profile with settings gear in the top-right toolbar"><img data-shot="user" src="/root/.t3/worktrees/MonaServer/t3-4b55c528/docs/ui-profile-alignment/user-profile.png" alt="User profile with the same top-right settings gear"><img data-shot="settings" src="/root/.t3/worktrees/MonaServer/t3-4b55c528/docs/ui-profile-alignment/group-settings.png" alt="Group settings with full information, sharing, editing, report and leave"><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelectorAll('img').forEach(x=>x.classList.toggle('active',x.dataset.shot===b.dataset.view))});</script></body></html>
