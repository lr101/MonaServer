<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--font-sans:system-ui,sans-serif;--foreground:#1c2329;--border:#c6cdd2;--radius:12px;--secondary:#e3ebef;--primary:#855000;--ring:#855000}body{margin:0;font-family:var(--font-sans);color:var(--foreground)}input{position:absolute;opacity:0}nav{display:flex;gap:8px;margin-bottom:12px}label{padding:10px 16px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer}figure{margin:0;display:none;text-align:center}img{max-width:100%;max-height:900px;object-fit:contain;border-radius:16px}#feed:checked~nav label[for=feed],#map:checked~nav label[for=map]{background:var(--secondary);border-color:var(--primary)}#feed:checked~.feed,#map:checked~.map{display:block}#feed:focus-visible~nav label[for=feed],#map:focus-visible~nav label[for=map]{outline:2px solid var(--ring)}</style></head><body><input type="radio" name="screen" id="feed" checked><input type="radio" name="screen" id="map"><nav aria-label="Restored app screens"><label for="feed">Feed</label><label for="map">Map</label></nav><figure class="feed"><img src="feed.png" alt="Live Flutter feed with the restored Map thumbnail selector"></figure><figure class="map"><img src="map.png" alt="Live Flutter map with restored icon-only location button"></figure></body></html>
